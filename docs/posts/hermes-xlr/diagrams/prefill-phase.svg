<svg width="100%" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="60" height="80" rx="4" fill="#A5D6A7" stroke="#388E3C"/>
  <text x="40" y="55" text-anchor="middle" font-size="11" fill="#1B5E20">Input</text>
  <text x="40" y="70" text-anchor="middle" font-size="11" fill="#1B5E20">Tokens</text>
  <text x="40" y="85" text-anchor="middle" font-size="10" fill="#555">[n x d]</text>

  <path d="M 70 50 L 95 50" stroke="#388E3C" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="100" y="5" width="70" height="90" rx="4" fill="#C8E6C9" stroke="#388E3C"/>
  <text x="135" y="30" text-anchor="middle" font-size="10" fill="#1B5E20" font-weight="bold">Q = X.W_q</text>
  <text x="135" y="48" text-anchor="middle" font-size="10" fill="#1B5E20" font-weight="bold">K = X.W_k</text>
  <text x="135" y="66" text-anchor="middle" font-size="10" fill="#1B5E20" font-weight="bold">V = X.W_v</text>
  <text x="135" y="88" text-anchor="middle" font-size="9" fill="#555">Matrix-Matrix</text>

  <path d="M 170 50 L 195 50" stroke="#388E3C" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="200" y="10" width="60" height="80" rx="4" fill="#FFE082" stroke="#F57F17"/>
  <text x="230" y="45" text-anchor="middle" font-size="10" fill="#E65100" font-weight="bold">KV</text>
  <text x="230" y="62" text-anchor="middle" font-size="10" fill="#E65100" font-weight="bold">Cache</text>
  <text x="230" y="85" text-anchor="middle" font-size="9" fill="#555">Populated</text>

  <rect x="10" y="110" width="300" height="60" rx="6" fill="#E8F5E9" stroke="#66BB6A" stroke-dasharray="4"/>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">Parallel across all tokens - saturates CUDA cores</text>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#555">Bottleneck: TFLOPS (compute limit)</text>
  <text x="160" y="164" text-anchor="middle" font-size="10" fill="#555">Latency: ~tens of ms (short prompts)</text>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6" fill="#388E3C"/>
    </marker>
  </defs>
</svg>
