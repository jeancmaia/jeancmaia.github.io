<svg width="100%" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="50" height="70" rx="4" fill="#90CAF9" stroke="#1565C0"/>
  <text x="35" y="50" text-anchor="middle" font-size="11" fill="#0D47A1">Token</text>
  <text x="35" y="66" text-anchor="middle" font-size="10" fill="#555">#m</text>

  <path d="M 60 45 L 90 45" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="95" y="5" width="60" height="80" rx="4" fill="#BBDEFB" stroke="#1565C0"/>
  <text x="125" y="30" text-anchor="middle" font-size="10" fill="#0D47A1" font-weight="bold">q = x.W_q</text>
  <text x="125" y="48" text-anchor="middle" font-size="10" fill="#0D47A1" font-weight="bold">(single)</text>
  <text x="125" y="78" text-anchor="middle" font-size="9" fill="#555">Matrix-Vector</text>

  <path d="M 155 45 L 180 45" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="185" y="10" width="60" height="70" rx="4" fill="#FFE082" stroke="#F57F17"/>
  <text x="215" y="40" text-anchor="middle" font-size="9" fill="#E65100">KV Cache</text>
  <text x="215" y="56" text-anchor="middle" font-size="9" fill="#E65100">Lookup</text>
  <text x="215" y="74" text-anchor="middle" font-size="8" fill="#555">O(1) per token</text>

  <path d="M 245 45 L 270 45" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="275" y="10" width="40" height="70" rx="4" fill="#C8E6C9" stroke="#388E3C"/>
  <text x="295" y="50" text-anchor="middle" font-size="9" fill="#1B5E20">Logit</text>

  <rect x="10" y="110" width="300" height="60" rx="6" fill="#E3F2FD" stroke="#42A5F5" stroke-dasharray="4"/>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="bold">Must load ALL weights from HBM to registers</text>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#555">Bottleneck: Memory Bandwidth (GB/s)</text>
  <text x="160" y="164" text-anchor="middle" font-size="10" fill="#555">Latency: ~30-50 ms per token (7B model)</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6" fill="#1565C0"/>
    </marker>
  </defs>
</svg>
